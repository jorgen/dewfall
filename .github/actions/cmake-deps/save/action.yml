name: Save the cmake-dep archive store
description: >-
  Prune the archive store to the enumerated dependency set and save it if it changed. Invoke with
  `if: always() && <configure step>.outcome == 'success'` so a failing build still leaves the cache
  behind. Only archives are cached: they are small, content-addressed and re-hashed on every use,
  and cmake-dep rebuilds the extracted trees from them offline.

inputs:
  dir:
    description: CMDEP_DIR relative to the workspace. Must match the restore step.
    default: 3rdparty
  manifest:
    description: The manifest path output by the restore action.
    required: true
  key:
    description: The key output by the restore action.
    required: true
  matched-key:
    description: >-
      The matched-key output from the restore action. actions/cache/save does not skip on its own, so
      without this every green run would re-tar the store only to have the reservation rejected.
    required: true

runs:
  using: composite
  steps:
    - name: Prune the archive store
      id: prune
      shell: bash
      run: |
        set -euo pipefail
        store="${{ inputs.dir }}/archives"
        if [ "${{ inputs.key }}" = "${{ inputs.matched-key }}" ]; then
          echo "dependency set unchanged since ${{ inputs.key }} — not re-saving"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$(find "$store" -type f -print -quit 2>/dev/null)" ]; then
          echo "no archives under $store — nothing to save"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A prefix hit restores whatever an older pin set left; keep only what this set uses.
        keep=$(awk -F'|' '$1 != "SYSTEM" { print tolower($5) "/" $6 }' "${{ inputs.manifest }}")
        find "$store" -type f | while IFS= read -r f; do
          rel="${f#"$store"/}"
          printf '%s\n' "$keep" | grep -qxF "$rel" || { echo "prune $rel"; rm -f "$f"; }
        done
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Save the archive store
      if: steps.prune.outputs.skip != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.dir }}/archives
        key: ${{ inputs.key }}
