name: Restore the cmake-dep archive store
description: >-
  Point cmake-dep at a cache directory inside the workspace (CMDEP_DIR) and restore its archive store
  from the Actions cache. cmake-dep re-hashes every stored archive before using it and refetches
  anything missing or corrupt, so a stale or partial restore costs downloads, never correctness.
  Pair with cmake-deps/save.

inputs:
  packages-file:
    description: The cmake-dep packages file that declares the dependency set.
    default: CMake/3rdPartyPackages.cmake
  project:
    description: >-
      The consuming project's project() name. cmake-dep builds its per-dependency override knobs from
      it (dewfall -> DEWFALL_<DEP>_VERSION / _URL / _SHA256, DEWFALL_USE_SYSTEM_<DEP>), so enumeration
      must use the same one the build does, or a -D override changes what is fetched without changing
      the key.
    default: dewfall
  dir:
    description: >-
      CMDEP_DIR, relative to the workspace. Exported to the job as an absolute path, so the configure
      and every nested project resolve the same directory. Must match the save step.
    default: 3rdparty
  profile:
    description: Discriminator for builds with a different dependency set (native / wasm / python).
    default: native
  cmake-args:
    description: Extra -D flags for enumeration, e.g. -DDEW_BUILD_PYTHON=ON. Must match the build's.
    default: ""
  epoch-file:
    description: >-
      File whose contents are folded into the cache key prefix. Bumping it in a commit abandons every
      existing entry.
    default: .github/deps-cache-epoch
  bootstrap-file:
    description: >-
      File to scrape the cmake-dep revision from (the FetchContent GIT_TAG). Only that line is folded
      into the key: cmake-dep decides the on-disk layout, unrelated edits must not cost the cache.
    default: CMakeLists.txt

outputs:
  key:
    description: The exact key for this dependency set; the save step writes under it.
    value: ${{ steps.key.outputs.key }}
  matched-key:
    description: The key actually restored, or empty on a cold cache. The save step skips when equal.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  manifest:
    description: Path to the enumerated dependency manifest, to be passed to the save step.
    value: ${{ steps.key.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: Enumerate dependencies and compute the cache key
      id: key
      shell: bash
      run: |
        set -euo pipefail
        command -v cmake >/dev/null || { echo "::error::cmake is not on PATH"; exit 1; }

        out="${RUNNER_TEMP}/cmake-deps"
        mkdir -p "$out"
        manifest="$out/manifest.txt"

        # The packages file plus the lockfile next to it, so vio's own dependencies are in the set.
        cmake ${{ inputs.cmake-args }} \
          -DCMDEP_PACKAGES_FILE="${GITHUB_WORKSPACE}/${{ inputs.packages-file }}" \
          -DCMDEP_ENUM_OUT="$manifest" \
          -DCMDEP_PROJECT="${{ inputs.project }}" \
          -P "${GITHUB_ACTION_PATH}/enumerate.cmake"
        test -s "$manifest" || { echo "::error::enumerated an empty dependency set"; exit 1; }

        # `|| true`: an epoch file that is all comments makes grep exit 1 under `set -e`.
        epoch=0
        if [ -f "${{ inputs.epoch-file }}" ]; then
          epoch=$(grep -v '^[[:space:]]*#' "${{ inputs.epoch-file }}" | tr -d '[:space:]' || true)
          [ -n "$epoch" ] || epoch=0
        fi
        pin=$(awk '/cmake-dep/ { seen = 1 } seen && /GIT_TAG/ { print $2; exit }' "${{ inputs.bootstrap-file }}" | cut -c1-12)
        [ -n "$pin" ] || pin=none
        if command -v sha256sum >/dev/null 2>&1; then sha="sha256sum"; else sha="shasum -a 256"; fi
        digest=$($sha < "$manifest" | cut -c1-16)

        # Restore takes the newest entry under the prefix, so one bumped pin costs one download.
        prefix="cmdep2-${epoch}-${{ inputs.profile }}-${{ runner.os }}-${pin}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}${digest}" >> "$GITHUB_OUTPUT"
        echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
        # $GITHUB_WORKSPACE, not ${{ github.workspace }}: inside a container job only the former is
        # the path the container sees.
        echo "CMDEP_DIR=${GITHUB_WORKSPACE}/${{ inputs.dir }}" >> "$GITHUB_ENV"
        echo "Dependency set: $(wc -l < "$manifest" | tr -d ' ') packages, epoch $epoch"

    - name: Restore the archive store
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.dir }}/archives
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
