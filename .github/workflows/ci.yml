name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorgen/dewfall-ci

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag from Dockerfile
        id: tag
        run: echo "tag=sha-$(sha256sum Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check
        run: |
          if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  sanitizers:
    needs: docker
    runs-on: ubuntu-24.04
    container: ghcr.io/jorgen/dewfall-ci:${{ needs.docker.outputs.image-tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            cc: gcc-14
            cxx: g++-14
            c_flags: -fsanitize=address -fno-omit-frame-pointer
            cxx_flags: -fsanitize=address -fno-omit-frame-pointer
            linker_flags: -fsanitize=address
          - name: tsan
            cc: gcc-14
            cxx: g++-14
            c_flags: -fsanitize=thread -fno-omit-frame-pointer
            cxx_flags: -fsanitize=thread -fno-omit-frame-pointer
            linker_flags: -fsanitize=thread
          # -fno-sanitize=vptr: dewfall is -fno-rtti, its third-party code is not, so vio's loop calling
          # a dewfall about_to_block_t override trips the vptr check on a type with no typeinfo.
          - name: ubsan
            cc: gcc-14
            cxx: g++-14
            c_flags: -fsanitize=undefined -fno-sanitize=vptr -fno-omit-frame-pointer -fno-sanitize-recover=all
            cxx_flags: -fsanitize=undefined -fno-sanitize=vptr -fno-omit-frame-pointer -fno-sanitize-recover=all
            linker_flags: -fsanitize=undefined
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore 3rdparty dependencies
        id: deps
        uses: ./.github/actions/cmake-deps

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure
        id: configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          # The ccache key is per-commit, so every run mints a fresh entry; at ~700 MB x 3 legs that
          # is ~2 GB per push against a 10 GB repository quota, and eviction is by last access. Left
          # unbounded, the sanitizer caches evict everything else in the repo — including the dependency
          # archive store restored just above. --max-size writes the cap into the cache dir's own
          # config, so it applies to the Build step too; an env var on this step alone would not.
          ccache --max-size=350M
          ccache --zero-stats
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DDEW_BUILD_EXAMPLES=OFF

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake --build build
          ccache --show-stats

      - name: Test
        run: |
          ./build/tests/public_interface_unit_tests
          ./build/tests/private_interface_unit_tests

      # Deliberately after the tests and deliberately always(): a red build must still leave the
      # dependency cache behind, or the run you are actively debugging refetches every time.
      # actions/cache@v4 cannot do this — its post step is post-if: success() — which is why the
      # restore and save halves are separate actions.
      #
      # Only one leg saves. All three compute the same key (they share a container, so runner.os
      # does not separate them), and the losers of that race just waste time taring the store.
      - name: Save 3rdparty dependencies
        if: always() && matrix.name == 'asan' && steps.configure.outcome == 'success'
        uses: ./.github/actions/cmake-deps/save
        with:
          manifest: ${{ steps.deps.outputs.manifest }}
          key: ${{ steps.deps.outputs.key }}
          matched-key: ${{ steps.deps.outputs.matched-key }}
