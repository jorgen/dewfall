name: Wheels

# One abi3 wheel per platform covering CPython 3.12+ (see pyproject.toml).
# Runs on demand and on tags; publishing is gated on the tag.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/wheels.yml
      - bindings/**
      - tools/bindgen/**
  push:
    tags: ["v*"]

concurrency:
  group: wheels-${{ github.ref }}
  # Right for a PR push, wrong for a release: four v0.1.0 attempts were force-pushed to the same tag
  # ref and each cancelled the run still in flight, so none of them ever produced an artifact.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # pyproject's faulthandler_timeout DUMPS a hung test's stacks but does not kill it, so without a
    # job bound a wedged test runs to the 6-hour default. Two arm64 jobs had to be cancelled by hand
    # at ~2.5h. A green run is about 20 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    name: manylinux_2_28 x86_64 }
          - { os: ubuntu-24.04-arm, name: manylinux_2_28 aarch64 }
          - { os: macos-15-intel,   name: macOS x86_64 }
          # macos-14 defaults to Xcode 15.4, whose Apple Clang lacks C++20
          # parenthesized aggregate initialization (P0960) that vendored vio
          # relies on; macos-15 ships Xcode 16.
          - { os: macos-15,         name: macOS arm64 }
          - { os: windows-latest,   name: Windows amd64, msvc_arch: x64 }
          - { os: windows-11-arm,   name: Windows arm64, msvc_arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      # Ninja needs cl.exe on PATH, and nothing else on these runners provides
      # it: CMake 3.31 has no generator for the installed Visual Studio 2026,
      # so both the default (NMake) and an explicit VS generator dead-end, and
      # bare Ninja finds the runner's MinGW gcc instead. vcvars works with
      # whichever VS is installed. Done inline rather than with a third-party
      # action, since this job's artifacts are what gets published.
      - name: Activate MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw "vswhere found no Visual Studio installation" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "no vcvarsall.bat under $install (C++ toolset not installed?)" }
          Write-Host "Using $install"
          cmd /c "`"$vcvars`" ${{ matrix.msvc_arch }} && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      # macOS and Windows build in the workspace itself, so an ordinary restore/save works. The
      # Linux legs are skipped on purpose: cibuildwheel streams the project INTO the manylinux
      # container and copies only /output back out, so a host-side save would capture whatever the
      # restore left and nothing the build fetched. Making it work needs CMDEP_DIR pointed at the
      # /host mount, which is unproven here.
      #
      # DEW_BUILD_PYTHON=ON comes from pyproject.toml, not from this workflow, so enumeration has
      # to be told about it — these legs fetch nanobind and robin_map on top of ci.yml's set.
      #
      # Scope note: wheels.yml never runs on a push to master, and a pull_request save is scoped to
      # refs/pull/N/merge, so this warms re-runs of the same PR rather than PRs in general.
      - name: Restore 3rdparty dependencies
        id: deps
        if: runner.os != 'Linux'
        uses: ./.github/actions/cmake-deps
        with:
          profile: python
          cmake-args: -DDEW_BUILD_PYTHON=ON

      - name: Build wheel
        id: build
        uses: pypa/cibuildwheel@v3.2.0

      # Stricter than ci.yml, which saves on a failed build as long as configure succeeded.
      # cibuildwheel fuses configure, build and test into one step, so a successful build is the
      # only available proof that the fetch actually finished — and stamping a tree that was cut
      # short mid-extraction would bless the truncation permanently. This workflow also sets
      # cancel-in-progress, which makes mid-extraction kills a real event rather than a theory.
      - name: Save 3rdparty dependencies
        if: always() && runner.os != 'Linux' && steps.build.outcome == 'success'
        uses: ./.github/actions/cmake-deps/save
        with:
          manifest: ${{ steps.deps.outputs.manifest }}
          prefix: ${{ steps.deps.outputs.prefix }}
          matched-key: ${{ steps.deps.outputs.matched-key }}
          removed: ${{ steps.deps.outputs.removed }}

      # Independent, symbol-level proof that the binary really is limited-API
      # and not a version-locked build mislabelled as abi3. The CMake
      # assertions in bindings/python/CMakeLists.txt catch this at build time;
      # this catches it in the artifact.
      - name: Audit abi3 tag
        shell: bash
        run: |
          python -m pip install --quiet abi3audit
          python -m abi3audit --strict --verbose wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --sdist
      - name: Check the sdist is not carrying the dependency cache
        run: |
          size=$(stat -c%s dist/*.tar.gz)
          echo "sdist is $((size / 1024 / 1024)) MB"
          test "$size" -lt 26214400 || { echo "sdist exceeds 25MB -- check sdist.exclude"; exit 1; }
          tar -tzf dist/*.tar.gz | grep -E "^[^/]+/(3rdparty|cmake-build|build)/" && \
            { echo "sdist contains build/dependency trees"; exit 1; } || true
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  # The point of an abi3 wheel is that ONE binary serves many interpreters.
  # Nothing else in this pipeline proves that, so install the cp312 wheel on
  # every later interpreter and run the real test suite. This is what caught
  # a limited-API bug that only manifested on 3.12.
  cross-version:
    name: ${{ matrix.os }} py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Must name runners that the wheels job actually built for, since the
        # artifact is wheel-${{ matrix.os }}.
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse
      - name: Install the wheel and run the suite
        shell: bash
        run: |
          python -m pip install --quiet pytest numpy
          python -m pip install --quiet --no-index --find-links wheelhouse dewfall
          python -c "import sys, dew; print(sys.version); print(dew.__file__, dew.__version__)"
          dew --version
          python -m pytest -q bindings/python/tests

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist, cross-version]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no long-lived token
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
